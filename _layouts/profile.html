---
layout: default
---

<main class="profile-shell" role="main">
  <article class="profile-content">
    {% if page.show_title != false and page.title %}
      <header class="page-intro">
        <p class="eyebrow">Ying Liu</p>
        <h1>{{ page.title }}</h1>
        {% if page.description %}<p>{{ page.description }}</p>{% endif %}
      </header>
    {% endif %}

    {{ content }}
  </article>
</main>
